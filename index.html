<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="google-site-verification" content="-9_kUpNBrwt9wmjzfq5t3td0CWmigTg3yRuO_KFhi6M" />
<title>ATO Syllabus Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script defer src="/_vercel/insights/script.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --panel-2:#1b232d; --line:#283140;
    --copper:#3d495c; --copper-dim:#252d3a;
    --accent:#4f9cf9; --accent-2:#6fb3ff; --accent-soft:rgba(79,156,249,.16); --done:#34d399; --done-soft:rgba(52,211,153,.16);
    --glow:rgba(79,156,249,.08); --done-line:rgba(52,211,153,.32); --on-accent:#06101f; --on-done:#06101f; --overlay:rgba(8,11,16,.78); --danger:#f87171; --text:#e6edf3; --text-dim:#8b97a8; --text-faint:#566173;
    --radius:10px;
    --font-display:'Inter','Segoe UI',sans-serif;
    --font-body:'Inter','Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse 900px 500px at 15% -10%, var(--glow), transparent 60%), var(--bg);
    color:var(--text); font-family:var(--font-body); line-height:1.5;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  ::selection{background:var(--accent-soft);color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  a{color:var(--accent);}
  button{font-family:var(--font-body);cursor:pointer;}

  .app{max-width:920px;margin:0 auto;padding:28px 20px 100px;}

  /* hero */
  .hero{background:linear-gradient(160deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 22px;margin-bottom:22px;position:relative;overflow:hidden;}
  .hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px;opacity:.12;pointer-events:none;}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;position:relative;flex-wrap:wrap;}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin:0 0 6px;}
  .hero-title{font-family:var(--font-display);font-weight:700;font-size:26px;margin:0;letter-spacing:-.01em;}
  .hero-title span{color:var(--accent);}
  .hero-sub{font-size:13px;color:var(--text-dim);margin:6px 0 0;}
  .stat-block{text-align:right;position:relative;}
  .stat-percent{font-family:var(--font-mono);font-size:40px;font-weight:600;color:var(--accent);line-height:1;}
  .stat-frac{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin-top:4px;}
  .charge-bar{position:relative;height:8px;border-radius:4px;background:var(--copper-dim);margin-top:20px;overflow:hidden;}
  .charge-fill{position:absolute;inset:0 auto 0 0;width:0%;background:linear-gradient(90deg,var(--accent-2),var(--accent));box-shadow:0 0 10px var(--accent-soft);transition:width .7s cubic-bezier(.4,0,.2,1);border-radius:4px;}

  /* toolbar */
  .toolbar{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap;position:relative;}
  .search-wrap{flex:1;min-width:180px;position:relative;}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-faint);}
  .search-wrap input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);font-family:var(--font-mono);font-size:13px;padding:9px 12px 9px 32px;border-radius:8px;}
  .search-wrap input::placeholder{color:var(--text-faint);}
  .btn{background:var(--bg);border:1px solid var(--line);color:var(--text-dim);font-family:var(--font-mono);font-size:12px;padding:9px 13px;border-radius:8px;display:flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;transition:border-color .15s,color .15s;}
  .btn:hover{border-color:var(--copper);color:var(--text);}
  .btn svg{width:14px;height:14px;}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger);}

  /* board */
  .board{display:flex;flex-direction:column;}
  .row{display:flex;align-items:stretch;gap:16px;}
  .spine{display:flex;flex-direction:column;align-items:center;width:44px;flex:none;}
  .connector{width:2px;flex:1;min-height:10px;background:var(--copper-dim);transition:background .5s,box-shadow .5s;}
  .connector.lit{background:var(--accent);box-shadow:0 0 6px var(--accent-soft);}
  .node{width:40px;height:40px;border-radius:50%;flex:none;padding:3px;background:conic-gradient(var(--accent-2),var(--accent) calc(var(--pct,0) * 1%),var(--copper-dim) 0);display:flex;align-items:center;justify-content:center;transition:background .4s;}
  .node-core{width:100%;height:100%;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-dim);}
  .node.complete .node-core{color:var(--accent);}

  /* paper card */
  .module{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
  .module-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;}
  .module-titles{flex:1;min-width:0;}
  .module-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:2px;}
  .module-name{font-family:var(--font-display);font-weight:600;font-size:15.5px;}
  .module-meta{display:flex;align-items:center;gap:10px;}
  .module-count{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);display:none;}
  @media(min-width:520px){.module-count{display:block;}}
  .module-pct{font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);min-width:34px;text-align:right;}
  .mini-bar{width:64px;height:5px;border-radius:3px;background:var(--copper-dim);overflow:hidden;display:none;}
  @media(min-width:520px){.mini-bar{display:block;}}
  .mini-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .5s;}
  .chevron{width:16px;height:16px;color:var(--text-faint);transition:transform .25s;flex:none;}
  .module.open > .module-header .chevron{transform:rotate(90deg);}
  .module-body{display:none;padding:10px 12px 12px;border-top:1px solid var(--line);}
  .module.open > .module-body{display:block;}

  /* topic (with its own spine + progress ring) */
  .trow{display:flex;align-items:stretch;gap:10px;}
  .tspine{display:flex;flex-direction:column;align-items:center;width:34px;flex:none;}
  .tconn{width:2px;flex:1;min-height:8px;background:var(--copper-dim);transition:background .5s,box-shadow .5s;}
  .tconn.lit{background:var(--accent);box-shadow:0 0 6px var(--accent-soft);}
  .tnode{width:32px;height:32px;border-radius:50%;flex:none;padding:3px;border:none;background:conic-gradient(var(--accent-2),var(--accent) calc(var(--pct,0) * 1%),var(--copper-dim) 0);display:flex;align-items:center;justify-content:center;transition:transform .15s;}
  .tnode:hover{transform:scale(1.08);}
  .tnode-core{width:100%;height:100%;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:9.5px;font-weight:600;color:var(--text-dim);}
  .tnode-core svg{width:13px;height:13px;display:none;}
  .tnode.complete .tnode-core{color:var(--accent);}
  .tnode.complete .tnode-core svg{display:block;}
  .tnode.complete .tnode-core span{display:none;}
  .topic{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--bg);overflow:hidden;transition:border-color .2s;}
  .tmeta{display:flex;align-items:center;gap:8px;align-self:center;flex:none;}
  .tmini{width:48px;height:4px;border-radius:2px;background:var(--copper-dim);overflow:hidden;display:none;}
  @media(min-width:520px){.tmini{display:block;}}
  .tmini-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .4s;}
  .tpct{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);min-width:32px;text-align:right;}
  .topic:hover{border-color:var(--copper-dim);}
  .topic.completed{border-color:var(--done-line);}
  .topic-row{display:flex;align-items:flex-start;gap:10px;padding:10px 10px 10px 12px;}
  .check{width:19px;height:19px;flex:none;margin-top:2px;border-radius:4px;border:1.5px solid var(--copper);background:transparent;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s;padding:0;}
  .check svg{width:12px;height:12px;opacity:0;color:var(--on-done);transition:opacity .1s;}
  .check:hover{border-color:var(--accent);}
  .check.on{background:var(--accent);border-color:var(--accent);}
  .check.on svg{opacity:1;}
  .topic-info{flex:1;min-width:0;cursor:pointer;}
  .topic-name{font-size:14px;line-height:1.4;}
  .topic.completed .topic-name{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--copper);}
  .topic-meta{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:2px;}
  .note-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);align-self:center;flex:none;display:none;}
  .note-dot.on{display:block;}
  .res-toggle{flex:none;background:none;border:none;color:var(--text-faint);font-family:var(--font-mono);font-size:11px;display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:6px;}
  .res-toggle:hover{color:var(--accent);background:var(--accent-soft);}
  .res-toggle svg{width:12px;height:12px;transition:transform .2s;}
  .trow.expanded .res-toggle svg{transform:rotate(180deg);}

  .topic-expand{display:none;padding:2px 12px 14px 12px;border-top:1px solid var(--line);}
  .trow.expanded .topic-expand{display:block;}

  .subs{padding-top:8px;margin-bottom:10px;}
  .sub{display:flex;align-items:flex-start;gap:10px;padding:5px 6px;border-radius:6px;transition:background .15s;}
  .sub:hover{background:var(--panel-2);}
  .sub .check{width:16px;height:16px;margin-top:3px;}
  .sub .check svg{width:10px;height:10px;}
  .sub-name{font-size:13px;color:var(--text);flex:1;}
  .sub.done .sub-name{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--copper);}

  .block-title{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin:12px 0 6px;}
  .res-list{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px;}
  .res-list:empty{display:none;}
  .res-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .res-chip a{flex:1;color:var(--text);text-decoration:none;border-bottom:1px dotted var(--copper);word-break:break-all;}
  .res-chip a:hover{color:var(--accent);border-color:var(--accent);}
  .res-del{flex:none;background:none;border:none;color:var(--text-faint);padding:2px;display:flex;}
  .res-del:hover{color:var(--danger);}
  .res-del svg{width:13px;height:13px;}
  .res-form{display:flex;gap:6px;flex-wrap:wrap;}
  .res-form input{background:var(--panel);border:1px solid var(--line);color:var(--text);font-family:var(--font-body);font-size:12.5px;padding:7px 9px;border-radius:6px;}
  .res-form input[name="label"]{width:120px;flex:1;min-width:100px;}
  .res-form input[name="url"]{width:220px;flex:2;min-width:140px;}
  .res-form button{background:var(--accent);border:none;color:var(--on-accent);font-family:var(--font-mono);font-weight:600;font-size:12px;padding:7px 12px;border-radius:6px;}
  .res-form button:hover{filter:brightness(1.08);}

  .notes-ta{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);font-family:var(--font-body);font-size:13px;line-height:1.5;padding:9px 11px;border-radius:8px;min-height:76px;resize:vertical;}
  .notes-ta::placeholder{color:var(--text-faint);}
  .notes-saved{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);opacity:0;transition:opacity .3s;margin-top:4px;}
  .notes-saved.show{opacity:1;}

  .empty-state{text-align:center;color:var(--text-faint);font-family:var(--font-mono);font-size:12.5px;padding:30px 10px;display:none;}

  /* modal */
  .modal-overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);max-width:480px;width:100%;max-height:90vh;overflow:auto;padding:22px;}
  .modal h3{font-family:var(--font-display);margin:0 0 8px;font-size:17px;}
  .modal p{color:var(--text-dim);font-size:13.5px;margin:0 0 16px;}
  .modal textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);font-family:var(--font-mono);font-size:11.5px;border-radius:8px;padding:10px;min-height:90px;resize:vertical;margin-bottom:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}
  .modal-actions .btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600;}
  .modal hr{border:none;border-top:1px solid var(--line);margin:16px 0;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--panel-2);border:1px solid var(--copper);color:var(--text);font-family:var(--font-mono);font-size:12.5px;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  footer{text-align:center;color:var(--text-faint);font-family:var(--font-mono);font-size:11px;margin-top:30px;}


  /* ---- refined theme overrides: graphite + blue, green for completed ---- */
  .hero{background:var(--panel);border-top:2px solid var(--accent);}
  .hero::before{display:none;}
  .hero-title{letter-spacing:-.02em;font-size:28px;}
  .charge-fill{background:linear-gradient(90deg,var(--accent),var(--done));box-shadow:none;}
  .charge-bar{height:6px;background:var(--copper-dim);}
  .stat-percent{color:var(--text);}
  .node,.tnode{background:conic-gradient(var(--accent) calc(var(--pct,0) * 1%),var(--copper-dim) 0);}
  .node.complete,.tnode.complete{background:var(--done);}
  .node.complete .node-core,.tnode.complete .tnode-core{color:var(--done);}
  .connector.lit,.tconn.lit{background:var(--done);box-shadow:none;}
  .mini-fill,.tmini-fill{background:var(--accent);}
  .module{background:var(--panel);}
  .module-label{color:var(--accent);}
  .topic{background:var(--panel-2);border-color:var(--line);}
  .topic:hover{border-color:var(--copper);}
  .topic.completed{border-color:var(--done-line);}
  .check.on{background:var(--done);border-color:var(--done);}
  .check:hover{border-color:var(--accent);}
  .note-dot{background:var(--accent);}
  .res-form input,.notes-ta{background:var(--bg);}
  .res-form button,.modal-actions .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .tpct{color:var(--text-dim);}
  .topic.completed .tpct{color:var(--done);}
  .sub:hover{background:var(--panel);}
  .btn:hover{border-color:var(--accent);color:var(--text);}
  .btn.danger:hover{border-color:var(--danger);}
  .toast{border-color:var(--accent);background:var(--panel-2);}
  a{color:var(--accent);}



  /* anchor rings to the top of their card (cards grow when expanded) */
  .spine > .connector:first-child{flex:0 0 12px;min-height:0;}
  .tspine > .tconn:first-child{flex:0 0 8px;min-height:0;}
  /* ---- touch targets & general mobile hygiene ---- */
  .hnode{display:none;}
  button,.btn,.module-header,.topic-info{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  .check,.tnode,.res-del{position:relative;}
  .check::after,.res-del::after{content:"";position:absolute;inset:-9px;}
  .tnode::after{content:"";position:absolute;inset:-6px;}
  .topic-name,.sub-name,.module-name{overflow-wrap:anywhere;}
  .app{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right));padding-bottom:max(100px,calc(60px + env(safe-area-inset-bottom)));}
  .toast{bottom:max(20px,calc(12px + env(safe-area-inset-bottom)));max-width:calc(100vw - 32px);text-align:center;}
  @media (hover:none){.tnode:hover{transform:none;}}

  /* ---- tablets / large phones ---- */
  @media (max-width:640px){
    .app{padding-top:14px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));}
    .hero{padding:18px 16px 16px;margin-bottom:16px;}
    .hero-top{flex-wrap:nowrap;align-items:flex-end;gap:12px;}
    .hero-top > div:first-child{flex:1;min-width:0;}
    .eyebrow{font-size:9.5px;letter-spacing:.08em;line-height:1.5;}
    .hero-title{font-size:23px;}
    .hero-sub{display:none;}
    .stat-percent{font-size:30px;}
    .stat-frac{font-size:11px;white-space:nowrap;}
    .charge-bar{margin-top:16px;}
    .toolbar{margin-top:16px;display:grid;gap:8px;}
    .search-wrap{grid-column:1 / -1;min-width:0;}
    .search-wrap input{font-size:16px;padding:11px 12px 11px 34px;}
    .btn{justify-content:center;padding:11px 6px;font-size:11.5px;min-width:0;}

    /* paper level: drop the side spine, put the ring inside the header */
    .row{gap:0;}
    .spine{display:none;}
    .hnode{display:flex;width:34px;height:34px;flex:none;}
    .hnode .node-core{font-size:11px;}
    .module{margin-bottom:12px;}
    .module-header{padding:12px 12px;gap:10px;}
    .module-name{font-size:15px;line-height:1.3;}
    .module-body{padding:10px 8px 10px;}

    /* topic level */
    .trow{gap:6px;}
    .tspine{width:30px;}
    .tnode{width:30px;height:30px;padding:3px;}
    .tnode-core{font-size:9px;}
    .topic-row{padding:11px 4px 11px 12px;gap:6px;}
    .topic-name{font-size:14px;}
    .tmeta{display:none;}
    .res-toggle{padding:8px 10px;}
    .topic-expand{padding:2px 12px 14px;}
    .sub{padding:8px 4px;gap:12px;}
    .sub .check{width:20px;height:20px;margin-top:1px;}
    .sub .check svg{width:12px;height:12px;}
    .sub-name{font-size:14px;line-height:1.4;}
    .res-form{flex-direction:column;}
    .res-form input,.res-form input[name="label"],.res-form input[name="url"]{width:100%;flex:none;font-size:16px;padding:10px 11px;}
    .res-form button{padding:11px;font-size:13px;}
    .res-chip{font-size:13.5px;}
    .res-del{padding:6px;}
    .res-del svg{width:16px;height:16px;}
    .notes-ta{font-size:16px;min-height:96px;}

    .modal-overlay{padding:12px;align-items:flex-end;}
    .modal{padding:18px;max-height:88vh;border-radius:14px;margin-bottom:env(safe-area-inset-bottom);}
    .modal textarea{font-size:16px;}
    .modal-actions .btn{padding:11px 16px;}
  }

  /* ---- small phones ---- */
  @media (max-width:420px){
    .eyebrow{letter-spacing:.05em;}
  }
  @media (max-width:340px){
    .stat-percent{font-size:26px;}
    .tspine{width:26px;}.tnode{width:26px;height:26px;}.tnode-core{font-size:8px;}
    .module-header{padding:10px 10px;}
  }


  /* ---- theme picker ---- */
  .modal.wide{max-width:620px;}
  .theme-group{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin:14px 0 8px;}
  .theme-group:first-of-type{margin-top:4px;}
  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
  .theme-card{background:var(--c-bg);border:1px solid var(--c-line);border-radius:9px;padding:10px 11px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:transform .12s,border-color .15s;min-width:0;}
  .theme-card:hover{transform:translateY(-1px);border-color:var(--c-accent);}
  .theme-card.active{outline:2px solid var(--accent);outline-offset:2px;}
  .tc-name{font-family:var(--font-mono);font-size:12px;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
  .tc-name svg{width:12px;height:12px;color:var(--c-accent);flex:none;display:none;}

  function rgb(h){ h=h.replace('#',''); return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16);}); }
  function hex(a){ return '#'+a.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return (v<16?'0':'')+v.toString(16);}).join(''); }
  function mix(a,b,t){ var x=rgb(a),y=rgb(b); return hex([0,1,2].map(function(i){return x[i]*(1-t)+y[i]*t;})); }
  function lum(h){ var c=rgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);}); return .2126*c[0]+.7152*c[1]+.0722*c[2]; }

})();

// ── STORAGE (same key + same shape as before, so existing users keep progress) ─
const KEY = 'ato_tracker_v2';
const UI_KEY = 'ato_tracker_ui';   // separate key: only remembers which papers are collapsed
let state = loadState();
let ui = loadUi();

function loadState(){
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function saveState(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch { showToast('Could not save — storage may be full or blocked. Use Backup.'); }
}
function loadUi(){
  try { const u = JSON.parse(localStorage.getItem(UI_KEY)); return { closed: Array.isArray(u && u.closed) ? u.closed : [] }; }
  catch { return { closed: [] }; }
}
function saveUi(){ try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch {} }

function getTopicState(id){ return state[id] || { done:false, subs:{}, notes:'', links:[] }; }
function setTopicState(id, data){ state[id] = data; saveState(); }

// ── HELPERS ───────────────────────────────────────────────────────────────
const ALL_TOPICS = SYLLABUS.flatMap(p => p.topics.map(t => ({ t, pid:p.id })));
const findTopic = id => ALL_TOPICS.find(x => x.t.id === id).t;

function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function safeHref(u){
  u = String(u || '').trim();
  if (!u) return '#';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;   // old links saved without a scheme
  return /^https?:/i.test(u) ? u : '#';                       // block javascript: etc.
}
function topicCounts(t){
  const ts = getTopicState(t.id);
  return { total:t.subtopics.length, done:t.subtopics.filter((_,i)=>ts.subs && ts.subs[i]).length };
}
function paperCounts(p){
  let total=0, done=0;
  p.topics.forEach(t => { const c = topicCounts(t); total += c.total; done += c.done; });
  return { total, done };
}
function overallCounts(){
  let total=0, done=0;
  SYLLABUS.forEach(p => { const c = paperCounts(p); total += c.total; done += c.done; });
  return { total, done };
}
function topicMetaText(t){
  const c = topicCounts(t), ts = getTopicState(t.id), n = (ts.links||[]).length;
  return c.done + '/' + c.total + ' subtopics' + (n ? ' · ' + n + ' link' + (n>1?'s':'') : '');

        </div>
        <div class="block-title">Resources &amp; links</div>
        <ul class="res-list" data-links>${(ts.links||[]).map(linkHtml).join('')}</ul>
        <form class="res-form" data-action="add-link">
          <input name="label" type="text" placeholder="Label (e.g. GeeksForGeeks)" autocomplete="off">
          <input name="url" type="text" placeholder="https://…" autocomplete="off" required>
          <button type="submit">Add</button>
        </form>
        <div class="block-title">Notes</div>
        <textarea class="notes-ta" data-notes placeholder="Add study notes, formulas, mnemonics…">${esc(ts.notes || '')}</textarea>
        <div class="notes-saved" data-notesaved>✓ Saved</div>
      </div>
    </div>
  </div>`;
}

// ── UPDATE ────────────────────────────────────────────────────────────────
function topicEl(id){ return document.getElementById('topic_' + id); }
function trowEl(id){ return document.querySelector(`.trow[data-topic="${id}"]`); }

function updateTopicUI(id){
  const el = topicEl(id), row = trowEl(id); if (!el) return;
  const t = findTopic(id), ts = getTopicState(id);
  const c = topicCounts(t);
  const pct = c.total ? Math.round(c.done/c.total*100) : 0;
  el.classList.toggle('completed', !!ts.done);
  const node = row.querySelector('.tnode');
  node.style.setProperty('--pct', pct);
  node.classList.toggle('complete', pct === 100);
  row.querySelector('[data-tpctnum]').textContent = pct;
  row.querySelector('[data-tconn-bottom]').classList.toggle('lit', pct === 100);
  row.querySelector('[data-tconn-top]').classList.toggle('lit', isPrevComplete(row));
  row.querySelector('[data-tpct]').textContent = pct + '%';
  row.querySelector('[data-tmini]').style.width = pct + '%';
  el.querySelectorAll('.sub').forEach(r => {
    const on = !!(ts.subs && ts.subs[r.dataset.sub]);
    r.classList.toggle('done', on);
    r.querySelector('.check').classList.toggle('on', on);
  });
  el.querySelector('[data-meta]').textContent = topicMetaText(t);
  el.querySelector('[data-notedot]').classList.toggle('on', !!ts.notes);
}
function isPrevComplete(row){
  const prev = row.previousElementSibling;
  return !!(prev && prev.classList.contains('trow') && prev.querySelector('.tnode').classList.contains('complete'));
}
function updatePaperUI(pid){
  const p = SYLLABUS.find(x => x.id === pid);
  const { total, done } = paperCounts(p);
  const pct = total ? Math.round(done/total*100) : 0;
  document.querySelector(`[data-ppct="${pid}"]`).textContent = pct + '%';
  document.querySelector(`[data-pcount="${pid}"]`).textContent = done + '/' + total;
  document.querySelector(`[data-minifill="${pid}"]`).style.width = pct + '%';
  const node = document.querySelector(`.node[data-node="${pid}"]`);
  node.style.setProperty('--pct', pct);
  node.classList.toggle('complete', pct === 100);
  document.querySelector(`[data-connector="${pid}"]`).classList.toggle('lit', pct === 100);
  const hn = document.querySelector(`[data-hnode="${pid}"]`);
  hn.style.setProperty('--pct', pct);
  hn.classList.toggle('complete', pct === 100);
}
function updateOverallUI(){
  const { total, done } = overallCounts();
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('overallPercent').textContent = pct + '%';
  document.getElementById('overallFrac').textContent = done + ' / ' + total + ' subtopics';
  document.getElementById('chargeFill').style.width = pct + '%';
}
function updateAllUI(){
  ALL_TOPICS.forEach(x => updateTopicUI(x.t.id));
  ALL_TOPICS.forEach(x => updateTopicUI(x.t.id)); // second pass lights top connectors
  SYLLABUS.forEach(p => updatePaperUI(p.id));
  updateOverallUI();
  syncToggleAllLabel();
}
function refreshLinks(id){
  const ts = getTopicState(id);
  topicEl(id).querySelector('[data-links]').innerHTML = (ts.links||[]).map(linkHtml).join('');
  topicEl(id).querySelector('[data-meta]').textContent = topicMetaText(findTopic(id));
}

// ── ACTIONS (same state transitions as the old version) ───────────────────
function toggleTopic(id){
  const t = findTopic(id), ts = getTopicState(id);
  ts.done = !ts.done;
  ts.subs = ts.subs || {};
  t.subtopics.forEach((_, i) => { ts.subs[i] = ts.done; });
  setTopicState(id, ts);
  updateTopicUI(id); refreshNeighbour(id);
  updatePaperUI(topicEl(id).dataset.paper);
  updateOverallUI();
}
function refreshNeighbour(id){
  const next = trowEl(id).nextElementSibling;
  if (next && next.classList.contains('trow')) updateTopicUI(next.dataset.topic);
}
function toggleSub(id, idx){
  const t = findTopic(id), ts = getTopicState(id);
  ts.subs = ts.subs || {};
  ts.subs[idx] = !ts.subs[idx];
  ts.done = t.subtopics.every((_, i) => ts.subs[i]);
  setTopicState(id, ts);
  updateTopicUI(id); refreshNeighbour(id);
  updatePaperUI(topicEl(id).dataset.paper);
  updateOverallUI();
}
function addLink(id, label, url){
  const ts = getTopicState(id);
  ts.links = ts.links || [];
  ts.links.push({ label: label || url, url });
  setTopicState(id, ts);
  refreshLinks(id);
}
function removeLink(id, idx){
  const ts = getTopicState(id);
  if (!ts.links) return;
  ts.links.splice(idx, 1);
  setTopicState(id, ts);
  refreshLinks(id);
}

// ── EVENTS (delegated) ────────────────────────────────────────────────────
boardEl.addEventListener('click', e => {
  const actEl = e.target.closest('[data-action]');
  if (!actEl || actEl.tagName === 'FORM') return;
  const action = actEl.dataset.action;
  const topic = actEl.closest('.trow');
  const tid = topic && topic.dataset.topic;
  if (action === 'toggle-paper') togglePaper(actEl.dataset.paper);
  else if (action === 'toggle-topic') toggleTopic(tid);
  else if (action === 'toggle-sub') toggleSub(tid, Number(actEl.dataset.idx));
  else if (action === 'expand') topic.classList.toggle('expanded');
  else if (action === 'del-link') removeLink(tid, Number(actEl.dataset.idx));
});
boardEl.addEventListener('submit', e => {
  const form = e.target.closest('form[data-action="add-link"]');
  if (!form) return;
  e.preventDefault();
  const tid = form.closest('.trow').dataset.topic;
  const url = form.elements.url.value.trim();
  if (!url) return;
  addLink(tid, form.elements.label.value.trim(), url);
  form.reset();
  form.elements.label.focus();
});
const noteTimers = {};
boardEl.addEventListener('input', e => {
  const ta = e.target.closest('[data-notes]');
  if (!ta) return;
  const tid = ta.closest('.trow').dataset.topic;
  clearTimeout(noteTimers[tid]);
  noteTimers[tid] = setTimeout(() => commitNotes(tid), 600);
});
function commitNotes(tid){
  clearTimeout(noteTimers[tid]); delete noteTimers[tid];
  const el = topicEl(tid); if (!el) return;
  const ta = el.querySelector('[data-notes]');
  const ts = getTopicState(tid);
  ts.notes = ta.value;
  setTopicState(tid, ts);
  el.querySelector('[data-notedot]').classList.toggle('on', !!ta.value);
  const saved = el.querySelector('[data-notesaved]');
  saved.classList.add('show'); setTimeout(() => saved.classList.remove('show'), 1500);
}
function flushNotes(){ Object.keys(noteTimers).forEach(commitNotes); }
window.addEventListener('pagehide', flushNotes);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushNotes(); });

function togglePaper(pid){
  const m = document.querySelector(`.module[data-paper="${pid}"]`);
  const open = m.classList.toggle('open');
  if (!searchInput.value.trim()){
    ui.closed = open ? ui.closed.filter(x => x !== pid) : ui.closed.concat(pid);
    saveUi();
  }
  syncToggleAllLabel();
}
function syncToggleAllLabel(){
  const anyOpen = !!document.querySelector('.module.open');
  document.getElementById('toggleAllLabel').textContent = anyOpen ? 'Collapse all' : 'Expand all';
}
document.getElementById('toggleAllBtn').addEventListener('click', () => {
  const open = !document.querySelector('.module.open');
  document.querySelectorAll('.module').forEach(m => m.classList.toggle('open', open));
  ui.closed = open ? [] : SYLLABUS.map(p => p.id);
  saveUi(); syncToggleAllLabel();
});

// search
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  let any = false;
  document.querySelectorAll('.trow').forEach(el => {
    const hit = !q || el.dataset.search.includes(q);
    el.style.display = hit ? '' : 'none';
  });
  document.querySelectorAll('.row').forEach(row => {
    const m = row.querySelector('.module');
    const has = !q || !!m.querySelector('.trow:not([style*="display: none"])');
    row.style.display = has ? '' : 'none';
    if (has) any = true;
    m.classList.toggle('open', q ? has : !ui.closed.includes(row.dataset.paperRow));
  });
  document.getElementById('emptyState').style.display = any ? 'none' : 'block';
  syncToggleAllLabel();
});

// ── MODALS: backup / restore / reset ──────────────────────────────────────
const modalRoot = document.getElementById('modalRoot');
function openModal(html, cls){
  modalRoot.innerHTML = '<div class="modal-overlay" id="overlay"><div class="modal ' + (cls||'') + '">' + html + '</div></div>';
  document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') { window.atoApplyTheme(window.atoThemeId(), false); closeModal(); } });
}
function closeModal(){ modalRoot.innerHTML = ''; }

function isValidBackup(o){
  if (!o || typeof o !== 'object' || Array.isArray(o)) return false;
  return Object.values(o).every(v => v && typeof v === 'object' && !Array.isArray(v));
}
function rebuild(){
  buildBoard(); updateAllUI(); searchInput.dispatchEvent(new Event('input'));
}

document.getElementById('backupBtn').addEventListener('click', () => {
  flushNotes();
  const json = JSON.stringify(state, null, 2);
  openModal(
    '<h3>Backup your progress</h3>' +
    '<p>Copy this and keep it somewhere safe. Browser data can be cleared, so keep a copy if your progress matters.</p>' +
    '<textarea readonly id="backupOut">' + esc(json) + '</textarea>' +
    '<div class="modal-actions"><button class="btn" id="copyBackupBtn">Copy</button><button class="btn" id="closeB1">Close</button></div>' +
    '<hr><h3>Restore from backup</h3>' +
    '<p>Paste a previously saved backup below (this replaces current progress).</p>' +
    '<textarea id="restoreIn" placeholder="Paste backup JSON here…"></textarea>' +
    '<div class="modal-actions"><button class="btn primary" id="restoreBtn">Load backup</button><button class="btn" id="closeB2">Cancel</button></div>'
  );
  document.getElementById('closeB1').onclick = closeModal;
  document.getElementById('closeB2').onclick = closeModal;
  document.getElementById('copyBackupBtn').onclick = () => {
    const ta = document.getElementById('backupOut'); ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject())
      .then(() => showToast('Backup copied to clipboard.'))
      .catch(() => showToast('Select the text and copy manually.'));
  };
  document.getElementById('restoreBtn').onclick = () => {
    const raw = document.getElementById('restoreIn').value.trim();
    if (!raw) return;
    try {
      const parsed = JSON.parse(raw);
      if (!isValidBackup(parsed)) throw new Error('bad');
      state = parsed; saveState(); rebuild(); closeModal(); showToast('Backup restored.');
    } catch { showToast('That backup could not be read.'); }
  };
});


// ── THEME PICKER ──────────────────────────────────────────────────────────
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = window.atoThemeId();
  const card = t => `
    <button type="button" class="theme-card ${t.id===cur?'active':''}" data-theme="${t.id}"
      style="--c-bg:${t.c.bg};--c-panel:${t.c.panel};--c-line:${t.c.line};--c-text:${t.c.text};--c-accent:${t.c.accent};--c-done:${t.c.done}">
      <span class="tc-name">${svgCheck}${esc(t.name)}</span>
      <span class="tc-bar"><i></i><i></i><i></i></span>
    </button>`;
  const dark = window.ATO_THEMES.filter(t => !t.light), light = window.ATO_THEMES.filter(t => t.light);
  openModal(
    '<h3>Theme</h3><p>Pick a look. On desktop, hover to preview. Your choice is remembered on this device.</p>' +
    '<div class="theme-group">Dark</div><div class="theme-grid" id="themeGridDark">' + dark.map(card).join('') + '</div>' +
    '<div class="theme-group">Light</div><div class="theme-grid" id="themeGridLight">' + light.map(card).join('') + '</div>' +
    '<div class="modal-actions" style="margin-top:16px"><button class="btn" id="closeTheme">Close</button></div>', 'wide'
  );
  const canHover = window.matchMedia && window.matchMedia('(hover:hover)').matches;
  const restore = () => window.atoApplyTheme(window.atoThemeId(), false);
  modalRoot.querySelectorAll('.theme-card').forEach(btn => {
    if (canHover) btn.addEventListener('mouseenter', () => window.atoApplyTheme(btn.dataset.theme, false));
    btn.addEventListener('click', () => {
      window.atoApplyTheme(btn.dataset.theme, true);
      modalRoot.querySelectorAll('.theme-card').forEach(b => b.classList.toggle('active', b === btn));
    });
  });
  modalRoot.querySelector('.modal').addEventListener('mouseleave', restore);
  document.getElementById('closeTheme').onclick = () => { restore(); closeModal(); };
});

document.getElementById('resetBtn').addEventListener('click', () => {
  openModal(
    '<h3>Reset all progress?</h3>' +
    '<p>This clears every completed topic, note and saved link on this device. This cannot be undone unless you have a backup.</p>' +
    '<div class="modal-actions"><button class="btn" id="cancelReset">Cancel</button><button class="btn danger" id="confirmReset">Reset everything</button></div>'
  );
  document.getElementById('cancelReset').onclick = closeModal;
  document.getElementById('confirmReset').onclick = () => {
    localStorage.removeItem(KEY); state = {};
    rebuild(); closeModal(); showToast('Progress reset.');
  };
});

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ── INIT ──────────────────────────────────────────────────────────────────
buildBoard();
updateAllUI();
</script>
</body>
</html>
